version: 2
project_name: hawkeye
release:
  github:
    owner: lehigh-university-libraries
    name: hawkeye

before:
  hooks:
    - go mod download

builds:
  - binary: hawkeye
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^fixtures:'

# Keep formula publication compatible with HTR and the existing Linux/macOS tap.
brews:
  - name: hawkeye
    homepage: https://github.com/lehigh-university-libraries/hawkeye
    description: Flag PDF and image pages for sensitive-information review
    commit_author:
      name: joecorall
      email: jjc223@lehigh.edu
    repository:
      owner: lehigh-university-libraries
      name: homebrew
    install: |
      bin.install "hawkeye"
    test: |
      assert_match version.to_s, shell_output("#{bin}/hawkeye --version")
    caveats: |
      A running Docker daemon and access to an on-prem Ollama service are required.
      Set OLLAMA_URL to override the default Lehigh Ollama endpoint.
